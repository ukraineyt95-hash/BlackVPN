name: Build Android APK

"on":
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

  NDK_VERSION: "27.0.12077973"

  RUST_TARGETS: "aarch64-linux-android armv7-linux-androideabi"

jobs:

  check:
    name: Check & test (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt (autoformat)
        run: cargo fmt --all || true

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
        continue-on-error: true

      - name: cargo test
        run: cargo test --all-features --lib --bins

  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    needs: check

    if: always() && needs.check.result != 'failure'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Add Android targets
        run: |
          for t in $RUST_TARGETS; do
            rustup target add "$t"
          done
          rustc --version
          cargo --version

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platforms;android-34
            build-tools;34.0.0
            platform-tools

      - name: Install Android NDK
        run: |
          yes | sdkmanager --install "ndk;${NDK_VERSION}" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          ls "$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" | head

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          key: android-${{ env.NDK_VERSION }}

      - name: Install cargo-apk
        run: |
          cargo install cargo-apk --locked
          cargo apk --version

      # Важно: cargo-apk не умеет описывать <service>, а без RustVpnService
      # приложение не может поднять VPN. Поэтому основной APK собирает
      # packager из android/AndroidManifest.xml (там сервис есть), а cargo-apk
      # остаётся дымовой проверкой сборки и не валит пайплайн.
      - name: Build APK (cargo apk, smoke)
        run: |
          cargo apk build --release --lib
          find target/release/apk -name "*.apk" -exec ls -lh {} \;
        continue-on-error: true

      - name: Build full APK (with VpnService) via packager
        run: |
          cargo run --release --bin packager -- \
            --ndk "$ANDROID_NDK_HOME" \
            --sdk "$ANDROID_SDK_ROOT" \
            --manifest android/AndroidManifest.xml \
            --out target/byebyedpi-apk

      - name: Check that a signed APK was produced
        run: |
          test -n "$(find target/byebyedpi-apk -maxdepth 1 -name '*.apk' -type f -print -quit)" \
            || { echo "packager не создал APK"; exit 1; }

      - name: List artifacts
        run: |
          mkdir -p artifact
          # Промежуточные -unaligned/-aligned копии не публикуем: они не подписаны.
          find target/byebyedpi-apk -name "*.apk" -type f \
            ! -name "*-unaligned.apk" ! -name "*-aligned.apk" \
            -exec sh -c 'cp "$1" artifact/' _ {} \;
          ls -lh artifact

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ByeByeDPI-Rust-apk
          path: |
            artifact/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload native libraries
        uses: actions/upload-artifact@v4
        with:
          name: ByeByeDPI-Rust-so
          path: |
            target/aarch64-linux-android/release/libbyebyedpi.so
            target/armv7-linux-androideabi/release/libbyebyedpi.so
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build-apk
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Rename APKs
        run: |
          mkdir -p release
          i=0
          for apk in $(find dist -name "*.apk" -type f | sort); do
            name=$(basename "$apk")
            cp "$apk" "release/ByeByeDPI-Rust-${i}-${name}"
            i=$((i+1))
          done
          ls -lh release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.apk
          generate_release_notes: true
