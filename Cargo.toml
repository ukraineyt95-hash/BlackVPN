[package]
name = "byebyedpi-rust"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
description = "DPI-bypass VPN client written entirely in Rust (no Java/Kotlin)"
license = "MIT"

[lib]

name = "byebyedpi"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "byebyedpi-desktop"
path = "src/main.rs"

[dependencies]

eframe = { version = "0.32.3", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
    "android-native-activity",
] }
egui = "0.32.3"
# winit 0.30 has no `std` feature: `std` belongs to its optional
# `raw-window-handle` edge (reachable only via `rwh_05`), so naming it here makes
# cargo fail during dependency resolution instead of at build time.
# The list below is winit's own `default` set (x11 + wayland + dlopen + adwaita
# decorations) plus `rwh_06`, which eframe/egui-winit require.
winit = { version = "0.30.12", default-features = false, features = [
    "rwh_06",
    "x11",
    "wayland",
    "wayland-dlopen",
    "wayland-csd-adwaita",
] }

tokio = { version = "1.40", features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "sync",
    "time",
    "macros",
    "fs",
] }

smoltcp = { version = "0.14", default-features = false, features = [
    "std",
    "medium-ip",
    "proto-ipv4",
    "proto-ipv6",
    "socket-tcp",
    "socket-udp",
    "socket-icmp",
    "auto-icmp-echo-reply",
    "iface-max-addr-count-4",
] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
rand = "0.8"
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"
android_logger = "0.14"

[package.metadata.android]

package = "com.example.byebyedpi"
apk_name = "ByeByeDPI-Rust"
build_targets = ["aarch64-linux-android", "armv7-linux-androideabi"]
strip = "strip"

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 34

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.FOREGROUND_SERVICE"

[[package.metadata.android.uses_permission]]
name = "android.permission.FOREGROUND_SERVICE_SPECIAL_USE"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_NETWORK_STATE"

[[package.metadata.android.uses_permission]]
name = "android.permission.POST_NOTIFICATIONS"

[[package.metadata.android.uses_permission]]
name = "android.permission.RECEIVE_BOOT_COMPLETED"

[package.metadata.android.application]
label = "ByeByeDPI-Rust"
has_code = false
extract_native_libs = true
uses_cleartext_traffic = true
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"

[package.metadata.android.application.activity]
name = "android.app.NativeActivity"
label = "ByeByeDPI-Rust"
exported = true
launch_mode = "singleTask"
orientation = "portrait"
config_changes = "orientation|keyboardHidden|screenSize|screenLayout|smallestScreenSize|uiMode|density"
always_retain_task_state = true

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"

[profile.dev]

opt-level = 1
